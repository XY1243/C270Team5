# URL of the Jenkins controller this agent connects back to (same box, all-in-one instance)
jenkins_url: "http://3.105.110.74:8080"
jenkins_agent_name: "aws-ec2-agent-1"

# Get this value from the Jenkins controller: Manage Jenkins > Nodes > <agent> > secret
# Never commit the real secret in plain text - encrypt it first, e.g.:
#   ansible-vault encrypt_string 'paste-the-real-secret-here' --name 'jenkins_agent_secret'
# then paste the resulting block below (or into group_vars/jenkins_agents/vault.yml).
jenkins_agent_secret: "CHANGE_ME"
