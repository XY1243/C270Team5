; Replace the placeholder IPs/DNS names with your actual AWS EC2 instances.
; Provision the instances first (raw Ubuntu 22.04 EC2 hosts), then point Ansible at them here.
;
; Single all-in-one instance: it's listed in both groups so it gets Docker,
; the Jenkins agent, and the app deployment all applied to the same box.

[jenkins_agents]
; EC2 instance(s) that will build the Docker image and run tests for the pipeline
aws-server-1 ansible_host=3.105.110.74

[app_servers]
; EC2 instance(s) that will run the deployed application via docker compose
aws-server-1 ansible_host=3.105.110.74

[k8s_deploy]
; Same all-in-one box, used to run kubectl/helm-style deploys against an EKS cluster
aws-server-1 ansible_host=3.105.110.74

[all:vars]
ansible_user=ubuntu
ansible_ssh_private_key_file=~/.ssh/id_rsa
ansible_python_interpreter=/usr/bin/python3
